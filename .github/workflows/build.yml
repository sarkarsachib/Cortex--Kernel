name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64
          - arm64
          - arm32
          - riscv

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly
        components: rust-src, rust-analyzer
        override: true

    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-system-misc binutils

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v3
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build target
      run: ./build/build.sh ${{ matrix.target }}

    - name: Check binary size
      run: ./build/size_check.sh

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly
        components: rust-src, rust-analyzer
        override: true

    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-system-misc binutils

    - name: Run tests
      run: ./build/test.sh

  build-all:
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: nightly
        components: rust-src, rust-analyzer
        override: true

    - name: Install QEMU
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-system-misc binutils

    - name: Build all targets
      run: ./build/build.sh all

    - name: Check binary sizes
      run: ./build/size_check.sh

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: cortex-mu-kernel-binaries
        path: |
          target/*/release/kernel
        retention-days: 30

    - name: Report sizes
      run: |
        echo "Cortex-μKernel Binary Sizes:"
        echo "============================"
        for dir in target/*/release; do
          if [ -f "$dir/kernel" ]; then
            size=$(stat -c%s "$dir/kernel")
            size_kb=$((size / 1024))
            echo "$(basename $(dirname $dir)): ${size_kb} KB"
          fi
        done
